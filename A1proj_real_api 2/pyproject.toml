[project]
name = "a1proj-real-api"
version = "1.0.0"
description = "A1 多模态检索 + 动态知识库（真实 API）"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.19",
    "dashvector>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "Pillow>=10.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

